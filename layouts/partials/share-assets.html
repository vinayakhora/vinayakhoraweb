{{- /*
  CSS + JS for the share rows (see layouts/partials/share.html).
  Emitted from <head> so it is valid wherever the share markup itself sits —
  the top row lives inside the <ul class="post__meta"> list, where a <style>
  block would not be a legal child.
*/ -}}
<style>
  .post__share {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
  }
  .post__share--bottom {
    margin: 2.5rem 0 1rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(128, 128, 128, 0.25);
  }
  .post__share--top {
    margin: 0;
    padding: 0;
    border: 0;
    gap: 0.5rem;
  }
  .post__share-label {
    font-size: 1.8rem;
    font-weight: 600;
    opacity: 0.75;
  }
  .post__share-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
  }
  /* circular icon buttons, filled with each network's brand colour */
  .post__share .post__share-buttons .share-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: 3.25rem;
    height: 3.25rem;
    min-width: 3.25rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #6b7280;
    color: #fff;
    font-size: 1.85rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    box-shadow: none;
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  .post__share .post__share-buttons .share-btn:hover,
  .post__share .post__share-buttons .share-btn:focus-visible {
    transform: translateY(-3px);
    filter: brightness(1.1);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    color: #fff;
    text-decoration: none;
  }
  /* NOTE: these must match the specificity of the base .share-btn rule above
     (three classes), otherwise the base grey background wins. */
  .post__share .post__share-buttons .share-btn--whatsapp { background: #25d366; }
  .post__share .post__share-buttons .share-btn--facebook { background: #1877f2; }
  .post__share .post__share-buttons .share-btn--instagram {
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
  }
  .post__share .post__share-buttons .share-btn--x        { background: #000000; }
  .post__share .post__share-buttons .share-btn--linkedin { background: #0a66c2; }
  .post__share .post__share-buttons .share-btn--telegram { background: #229ed9; }
  .post__share .post__share-buttons .share-btn--email    { background: #ea4335; }
  .post__share .post__share-buttons .share-btn--copy     { background: #6b7280; }
  .post__share .post__share-buttons .share-btn--native   { background: #6366f1; }
  .post__share-toast {
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .post__share-toast.is-visible { opacity: 0.8; }
  /* keep the share icons vertically centred against the date / reading-time text */
  .post__meta {
    align-items: center;
    flex-wrap: wrap;
    row-gap: 0.6rem;
  }
  .post__meta-item--share {
    display: flex;
    align-items: center;
  }
</style>

<script>
  (function () {
    function init() {
      var boxes = document.querySelectorAll('.post__share');
      Array.prototype.forEach.call(boxes, function (box) {
        var url = box.getAttribute('data-share-url');
        var title = box.getAttribute('data-share-title');
        var toast = box.querySelector('.post__share-toast');

        function flash(msg) {
          if (!toast) { return; }
          toast.textContent = msg;
          toast.classList.add('is-visible');
          setTimeout(function () { toast.classList.remove('is-visible'); }, 2000);
        }

        var nativeBtn = box.querySelector('.share-btn--native');
        if (nativeBtn && navigator.share) {
          nativeBtn.hidden = false;
          nativeBtn.addEventListener('click', function () {
            navigator.share({ title: title, url: url }).catch(function () {});
          });
        }

        // NOTE ON FACEBOOK: the button deliberately uses sharer.php in the
        // browser on every device. Handing the URL to the Facebook app (via the
        // OS share sheet or an fb:// link) makes the app open its *Stories*
        // composer, not a feed post, and that choice belongs to the app - it
        // cannot be overridden from the web. sharer.php always opens the feed
        // composer, so it is left alone here.

        function copyUrl(then) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(then).catch(then);
            return;
          }
          var tmp = document.createElement('textarea');
          tmp.value = url;
          tmp.setAttribute('readonly', '');
          tmp.style.position = 'absolute';
          tmp.style.left = '-9999px';
          document.body.appendChild(tmp);
          tmp.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(tmp);
          then();
        }

        var copyBtn = box.querySelector('.share-btn--copy');
        if (copyBtn) {
          copyBtn.addEventListener('click', function () {
            copyUrl(function () { flash(copyBtn.getAttribute('data-copied-text')); });
          });
        }

        // Instagram accepts no shared links from the web - not via a sharer URL,
        // not via a deep link. The only workable pattern is to put the URL on the
        // clipboard and open Instagram so the user can paste it into a story,
        // a DM or their bio.
        var igBtn = box.querySelector('.share-btn--instagram');
        if (igBtn) {
          igBtn.addEventListener('click', function () {
            copyUrl(function () {
              flash(igBtn.getAttribute('data-copied-text'));
              window.open('https://www.instagram.com/', '_blank', 'noopener');
            });
          });
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
