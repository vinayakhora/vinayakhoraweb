{{- /*
  CSS + JS for the share rows (see layouts/partials/share.html).
  Emitted from <head> so it is valid wherever the share markup itself sits —
  the top row lives inside the <ul class="post__meta"> list, where a <style>
  block would not be a legal child.
*/ -}}
<style>
  .post__share {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
  }
  .post__share--bottom {
    margin: 2.5rem 0 1rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(128, 128, 128, 0.25);
  }
  .post__share--top {
    margin: 0;
    padding: 0;
    border: 0;
    gap: 0.5rem;
  }
  .post__share-label {
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0.75;
  }
  .post__share-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  /* circular icon buttons */
  .post__share .post__share-buttons .share-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: 2.25rem;
    height: 2.25rem;
    min-width: 2.25rem;
    padding: 0;
    border: 1px solid rgba(128, 128, 128, 0.35);
    border-radius: 50%;
    background: transparent;
    color: inherit;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    box-shadow: none;
    transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .post__share .post__share-buttons .share-btn:hover,
  .post__share .post__share-buttons .share-btn:focus-visible {
    transform: translateY(-2px);
    color: #fff;
    border-color: transparent;
    text-decoration: none;
  }
  .post__share .share-btn--whatsapp:hover, .post__share .share-btn--whatsapp:focus-visible { background: #25d366; }
  .post__share .share-btn--facebook:hover, .post__share .share-btn--facebook:focus-visible { background: #1877f2; }
  .post__share .share-btn--x:hover,        .post__share .share-btn--x:focus-visible        { background: #000; }
  .post__share .share-btn--linkedin:hover, .post__share .share-btn--linkedin:focus-visible { background: #0a66c2; }
  .post__share .share-btn--telegram:hover, .post__share .share-btn--telegram:focus-visible { background: #229ed9; }
  .post__share .share-btn--email:hover,    .post__share .share-btn--email:focus-visible    { background: #6b7280; }
  .post__share .share-btn--copy:hover,     .post__share .share-btn--copy:focus-visible     { background: #6b7280; }
  .post__share .share-btn--native:hover,   .post__share .share-btn--native:focus-visible   { background: #6b7280; }
  .post__share-toast {
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .post__share-toast.is-visible { opacity: 0.8; }
  /* keep the share icons vertically centred against the date / reading-time text */
  .post__meta {
    align-items: center;
    flex-wrap: wrap;
    row-gap: 0.6rem;
  }
  .post__meta-item--share {
    display: flex;
    align-items: center;
  }
</style>

<script>
  (function () {
    function init() {
      var boxes = document.querySelectorAll('.post__share');
      Array.prototype.forEach.call(boxes, function (box) {
        var url = box.getAttribute('data-share-url');
        var title = box.getAttribute('data-share-title');
        var toast = box.querySelector('.post__share-toast');

        function flash(msg) {
          if (!toast) { return; }
          toast.textContent = msg;
          toast.classList.add('is-visible');
          setTimeout(function () { toast.classList.remove('is-visible'); }, 2000);
        }

        var nativeBtn = box.querySelector('.share-btn--native');
        if (nativeBtn && navigator.share) {
          nativeBtn.hidden = false;
          nativeBtn.addEventListener('click', function () {
            navigator.share({ title: title, url: url }).catch(function () {});
          });
        }

        var copyBtn = box.querySelector('.share-btn--copy');
        if (copyBtn) {
          copyBtn.addEventListener('click', function () {
            var done = function () { flash(copyBtn.getAttribute('data-copied-text')); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(url).then(done).catch(function () {});
            } else {
              var tmp = document.createElement('textarea');
              tmp.value = url;
              tmp.setAttribute('readonly', '');
              tmp.style.position = 'absolute';
              tmp.style.left = '-9999px';
              document.body.appendChild(tmp);
              tmp.select();
              try { document.execCommand('copy'); done(); } catch (e) {}
              document.body.removeChild(tmp);
            }
          });
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
